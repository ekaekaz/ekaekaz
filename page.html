<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учебная страница</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #1f2328;
      --bg: #ffffff;
      --muted: #6e7781;
      --code-bg: #f0f2f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e6edf3;
        --bg: #0d1117;
        --muted: #8b949e;
        --code-bg: #1f252d;
      }
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }
    h1 { margin-top: 0; }
    code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; }
    footer { margin-top: 40px; font-size: 0.9em; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Привет!</h1>
  </header>
  <main>
    <p>Это учебная HTML-страница в репозитории <code>ekaekaz</code>.</p>
    <ul>
      <li>Первый пункт</li>
      <li>Второй пункт</li>
      <li>Третий пункт</li>
    </ul>
  </main>
  <footer>
    <p>Создано для GitHub Classroom.</p>
  </footer>
</body>
</html>
